name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported interpreter,
        # the current CachyOS/Arch interpreter and the newest release.
        python: ["3.11", "3.14", "3.15"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt

      # PyQt6's bundled Qt needs these system libraries even to import; the
      # German locale lets the locale-independence regression test run.
      - name: Install Qt runtime libraries and test locale
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1
          sudo locale-gen de_DE.UTF-8 >/dev/null

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Compile
        run: python -m py_compile cachy-update-history.py tests/test_app.py tests/test_docs.py

      - name: Test
        run: python -W error::DeprecationWarning -m unittest discover -s tests -v
